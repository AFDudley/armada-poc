[profile.default]
src = "contracts"
test = "test-foundry"
out = "forge-out"
libs = ["node_modules", "lib"]

# Solidity config matching hardhat.config.ts
# Per-path compiler versions mirror hardhat.config.ts: see compilation_restrictions at the end.
evm_version = "london"

# The vendored GnosisSafe (lib/safe-contracts, G2/arp-1f1) has execTransaction/checkSignatures
# functions with enough locals to hit "stack too deep" without the optimizer. Enabling it only
# reduces gas (existing forge gas assertions are all upper bounds, assertLt/assertTrue, never
# exact equality — grep confirms no assertEq on a gas value), so this is safe project-wide.
optimizer = true
optimizer_runs = 200

# Remappings for OpenZeppelin (existing) plus the vendored Baal/Safe dependencies
# under lib/ (Baal feat/baalZodiac + Gnosis Safe, and their transitive deps zodiac + opengsn).
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@gnosis.pm/safe-contracts/=lib/safe-contracts/",
    "@gnosis.pm/zodiac/=lib/zodiac/",
    "@opengsn/contracts/=lib/opengsn/",
]

# Pin the Poseidon library link addresses. The in-tree PoseidonLibs.sol files are
# compile-time stubs; tests that exercise real hashing must place the generated
# Poseidon bytecode at these addresses (see test-foundry/helpers/PoseidonLinker.sol).
libraries = [
    "contracts/privacy-pool/types/PoseidonLibs.sol:PoseidonT3:0x9000000000000000000000000000000000000903",
    "contracts/privacy-pool/types/PoseidonLibs.sol:PoseidonT4:0x9000000000000000000000000000000000000904",
]

# Allow tests to read the generated Poseidon bytecode fixture (PoseidonLinker).
fs_permissions = [
    { access = "read", path = "./lib/poseidon_bytecode.json" },
    { access = "read", path = "./test-foundry/fixtures/snark" },  # real-proof verifier fixture (#604)
    { access = "read", path = "./contracts/governance/ArmadaToken.sol" },  # source-level invariant scan (G1/arp-53a)
]

# Invariant test config
[invariant]
runs = 256
depth = 50
fail_on_revert = false

# `forge build` (no test/offline filter) runs a newer "lint on build" pass (forge 1.8.3+)
# that this project has never been clean under — it fails on pre-existing, unrelated
# contracts (e.g. contracts/GaslessShieldWrapperClient.sol's SignatureChecker import) that
# have nothing to do with this change. scripts/summon-baal-safe.ts (G2/arp-1f1) is the
# first script in this repo to need a bare `forge build` (to populate forge-out/ for the
# vendored Baal/Safe artifacts it loads), exposing the gap. Disabling lint-on-build restores
# `forge build`'s prior (pre-lint-feature) behavior; `forge test`'s own compilation already
# does not trip this, so the actual test suite is unaffected either way.
[lint]
lint_on_build = false

# Mirrors hardhat.config.ts: the privacy pool, yield, fees, CCTP and other out-of-scope contracts stay
# on 0.8.17; audit-scope governance and crowdfund contracts, and the vendored Hedgey lockup they
# deploy, compile with 0.8.20 (the highest version that satisfies the bound below). A file shared by
# both sides (for example contracts/governance/IFeeCollector.sol) compiles in each version.
[[profile.default.compilation_restrictions]]
paths = "{contracts/privacy-pool,contracts/yield,contracts/cctp,contracts/fees,contracts/periphery,contracts/aave-mock,contracts/test}/**"
version = "=0.8.17"

[[profile.default.compilation_restrictions]]
paths = "contracts/{Faucet,GaslessShieldWrapper,GaslessShieldWrapperClient}.sol"
version = "=0.8.17"

[[profile.default.compilation_restrictions]]
paths = "{contracts/governance,contracts/crowdfund,lib,test-foundry,script,node_modules}/**"
version = "<=0.8.20"

# The vendored Hedgey lockup (pragma ^0.8.20) hits "stack too deep" in TokenLockupPlans.sol
# without the IR pipeline. Only compilation units that contain Hedgey sources use it.
[[profile.default.compilation_restrictions]]
paths = "lib/hedgey/**"
via_ir = true

[[profile.default.additional_compiler_profiles]]
name = "via-ir"
via_ir = true
