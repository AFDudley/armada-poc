summary: >-
  Added test-foundry/HubPoolOwnerGuard.t.sol (PoolOwnerAuthorityTest) proving the four spec-named properties of the Hub PrivacyPool: no upgradeTo/upgradeToAndCall entry point (c1), owner set once in initialize and not the governor/treasury/wind-down (c2), owner-only setVerificationKey with non-owner reverts and owner call stores the key (c3), and the owner key path kept with testing mode off (c4). Verified with `forge test --match-contract PoolOwnerAuthorityTest` (4/4 pass) and the full forge suite (487 pass, 0 fail). Mutation sanity: mutating the router's owner assignment (PrivacyPool.sol) or the verifier module's gate (VerifierModule.sol) turns the tests RED, so the suite catches single-operator mutations in its targets. Only the test file is added; the pool contracts are unchanged (issue #349: setVerificationKey remains owner-callable).
cost: ~40k tokens
