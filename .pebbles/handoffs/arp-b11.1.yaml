summary: >
  Added test-foundry/HubPoolOwnerGuard.t.sol (PoolOwnerAuthorityTest) with four forge tests
  that prove the Hub PrivacyPool's owner-authority properties: no upgradeTo/upgradeToAndCall
  entry point (c1), the owner set once in initialize and not DAO-reachable (c2), only the
  owner can call setVerificationKey — non-owner reverts and owner call stores the key (c3),
  and the owner key path stays live with testing mode off (c4). All four tests deploy the
  existing pool (router + modules + CCTP mocks) and exercise the owner-gated key path so a
  mutation of the pool router or the verifier module is caught. Verified with forge test
  test-foundry/HubPoolOwnerGuard.t.sol: 4/4 pass. Confirmed the mutation gate: flipping the
  owner-gate operator in PrivacyPool.setVerificationKey (or VerifierModule.setVerificationKey)
  turns all four tests red (exit 1) while the unmutated baseline stays green (exit 0).
  node_modules linked from the parent checkout (gitignored, not committed) so forge resolves
  the @openzeppelin imports.
