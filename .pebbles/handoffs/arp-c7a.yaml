status: completed
pebble_id: arp-c7a
summary: >
  Made the derived-arp-c7a spec pass. ArmadaCrowdfund.finalize now shields the
  sale proceeds into the privacy pool as one Safe-owned note (Safe npk) in the same
  call, instead of a plain USDC transfer to the public treasury address. Added
  scripts/check-crowdfund-shielded-proceeds.sh, the merge-gate oracle that runs the
  shielded-proceeds forge test with -vv, extracts the CROWDFUND_SHIELDED_PROCEEDS_JSON
  probe line, and appends the suite pass/fail counts, emitting one merged JSON object.
  Updated the two existing crowdfund suites (CrowdfundRoundingBuffer, CrowdfundReentrancy)
  to the shielded/Safe-note model so the whole branch is consistent with G5: RoundingBuffer
  deploys the pool with a Safe-owned note (SAFE_NPK) and reads the note via the pool's
  preimageOf getter (refactored into a _readNote helper to clear the stack-too-deep
  without viaIR); Reentrancy deploys a pool in the failing test (setUp did not) so
  finalize reaches a real pool rather than reverting at the zero-address feeRecipient.
