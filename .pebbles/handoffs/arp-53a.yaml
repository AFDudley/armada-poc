summary: >
  Added test-foundry/ArmadaTokenShares.t.sol with six forge tests proving the
  G1 ArmadaToken Baal-shares invariants from
  labbook/2026-10-18-treasury-governance-baal-safe-shielded.md §3
  decisions 3-5 and docs/tasks/G1-arm-shares-token.md: (1) single-mint fixed
  12,000,000e18 supply plus a source-level scan confirming exactly one
  _mint( call site; (2) non-proxy-bytecode via a source-level scan for
  delegatecall/_authorizeUpgrade/Initializable/UUPSUpgradeable; (3)
  whitelist-gating (initWhitelist deployer-only one-shot, addToWhitelist
  timelock-only add-only, non-timelock caller reverts); (4)
  restricted-transfer reverting with 'ArmadaToken: transfers restricted';
  (5) mint-not-blocked (from==address(0) never restricted); (6)
  timelock-set-transferable succeeding with windDownContract never set. No
  contract edit was needed or made: all six tests pass against
  contracts/governance/ArmadaToken.sol unmodified, per the brief's S6
  instruction to escalate rather than silently edit if any invariant did
  not already hold. Added scripts/check-armada-token-invariants.py, the
  mutation-kill checker required by contracts/specs/derived-arp-53a.spec.json:
  for each of the six assertions it confirms the test exists and passes on
  the real contract, applies the matching breaking mutation via
  safe-guarded substring patch on ArmadaToken.sol (asserting the anchor
  text is present exactly once before patching, and always restoring the
  original file in a finally block), reruns the single test, and confirms
  it now fails. --all aggregates all six (assertions_missing,
  mutations_surviving); --regression runs the full existing forge suite
  and checks this chunk's own deliverables never call
  setWindDownContract and that circulatingSupplyOf/delegateOnBehalf/
  transferAndDelegate/_delegate (noDelegation enforcement) are
  byte-for-byte unchanged via extracted-function-body comparison against a
  hardcoded reference. foundry.toml gained one fs_permissions read entry
  scoped to ./contracts/governance/ArmadaToken.sol, needed for the
  source-level vm.readFile scans in tests 1 and 2. Verified by running
  forge test --match-path test-foundry/ArmadaTokenShares.t.sol -vv (6/6
  pass), the full forge test suite (794/794 pass, unchanged from
  baseline), and all eight acceptance_tests in the linked spec exactly as
  specified (six --assertion/--mutate pairs, --all, --regression), each
  producing the exact JSON fields and values the spec's `then` clauses
  require.
