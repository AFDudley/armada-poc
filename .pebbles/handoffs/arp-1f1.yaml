summary: >
  Vendored Gnosis Safe (safe-contracts v1.3.0, commit 186a21a) and HausDAO
  Baal (feat/baalZodiac, commit ee3d5ab, the Hacken/Quantstamp-audited
  version) under lib/, each pinned via a pin.json recording its commit
  hash, plus Baal's transitive deps zodiac (3.3.7) and opengsn (2.2.5)
  needed for it to compile; added matching remappings to foundry.toml.
  Wrote scripts/summon-baal-safe.ts, wired into package.json's setup
  chain as deploy:governance-baal right after deploy:governance. The
  script deploys the Safe proxy with empty setup data (zero owners, not
  yet initialized — no owner of any kind, human or otherwise, exists at
  that point), clones the vendored Baal template via zodiac's
  ModuleProxyFactory, then calls safe.setup(owners=[baal], threshold=1,
  ...) directly, enabling Baal as a Safe module in the same call — the
  Safe's first and only owner-bearing state has the Baal as its sole
  owner, never a human key, even transiently. FINDING, documented in the
  script and in contracts/governance/BaalSharesToken.sol: G1's
  ArmadaToken cannot be Baal's shares token directly, because it has no
  paused()/mint()/burn()/owner(), which Baal's vendored core (Baal.setUp
  and its share-management calls) requires (BaalSummoner.sol's own
  comment on bring-your-own tokens: "tokens need to be baalTokens"). So
  the script deploys BaalSharesToken (a new, minimal ERC20Votes
  implementing exactly the function surface Baal calls) configured
  name/symbol "ARM" as the token actually registered on Baal, and
  separately records G1's real ArmadaToken address for cross-reference
  only. Added test-foundry/BaalSafeSummon.t.sol (4 tests) asserting the
  same three facts on a local EVM via forge, using a local MockBaalToken
  instead of importing lib/baal's SharesERC20.sol/LootERC20.sol (those
  are pinned to an exact `pragma solidity 0.8.7`, incompatible with
  forge-std's `>=0.8.13` in the same compilation unit). foundry.toml
  gained optimizer=true (the vendored GnosisSafe hits "stack too deep"
  without it; all existing gas assertions are upper bounds, so this is
  safe) and lint_on_build=false (forge 1.8.3's new lint-on-build pass
  fails on pre-existing, unrelated contracts this project was never
  clean under; forge test's own compilation doesn't trip it either
  way). config/networks.ts gained getBaalSafeDeploymentFile() for the
  new deployments/baal-safe-hub.json manifest. scripts/check-secrets.sh
  gained an allowlist for lib/safe-contracts/ and lib/opengsn/ (vendored
  EIP-712 typehash / bit-mask constants the secret scanner flagged as
  false positives). Wrote scripts/verify-baal-safe-summon.py, the
  spec's acceptance oracle, with --report {vendoring, wiring, safe,
  shares-token, owner-history, forge-test}. Verified by running the
  full forge suite (798/798 passing, up from 794 — +4 new tests, 0
  regressions); running `npx hardhat run scripts/deploy_governance.ts`
  then `npx hardhat run scripts/summon-baal-safe.ts` on a live anvil hub,
  which printed the Safe (1 owner — the Baal — threshold 1, 0 human
  owners), the Baal's registered shares token equal to the deployed ARM
  (BaalSharesToken), and an owner-history (safe-proxy-created,
  safe-setup-complete) with 0 human owners at every step; and running
  all six `verify-baal-safe-summon.py --report <name>` invocations,
  each producing exactly the field values
  contracts/specs/derived-arp-1f1.spec.json's acceptance_tests require.
