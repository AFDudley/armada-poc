status: completed
pebble_id: arp-3a7
summary: >
  Proved the Hub PrivacyPool is non-upgradeable and that its owner (the
  verification-key authority, issue #349) is never a governance-reachable
  address. scripts/deploy_privacy_pool.ts (deployHub) now accepts the
  POOL_OWNER_ADDRESS owner-key input (c4), compares it to the governance
  governor/treasury/wind-down addresses and refuses on a match (c3).
  Added scripts/verify_hub_owner_guard.sh, the acceptance oracle, with
  --guard-cases (refused on governor/treasury/wind-down, accepted on a
  distinct owner) and --owner-input (owner equals the dedicated input and
  differs from the deployer). Added test-foundry/HubPoolOwnerGuard.t.sol
  with three forge tests: test_PoolHasNoUpgradeEntryPoint (c1, both
  upgradeTo/upgradeToAndCall fail so the pool cannot be swapped for other
  code), test_PoolOwnerIsNotGovernanceControlled (c2, pool owner differs
  from the governor/treasury/wind-down), and test_SetVerificationKeyOwnerOnly
  (c5, the owner can set a verification key, a stranger cannot). The pool
  deploy now signs the owner-gated setVerificationKey and setShieldFee as
  the pool owner (an anvil account) when the owner is a local signer, and
  records poolOwner in the privacy-pool-hub.json manifest. Verified by
  running the full forge suite (3/3 new tests passing) and both
  verify_hub_owner_guard.sh cases (guard-cases: 4 refusals/acceptance
  true; owner-input: owner_equals_input=true, owner_equals_deployer=false).
cost: "~120k tokens"
