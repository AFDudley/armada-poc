summary: >
  Removed the dead ArmadaToken addToWhitelist and wind-down code
  references from the two armada-poc scripts, per E6 (arp-6bc) which
  deleted both from contracts/governance/ArmadaToken.sol.
  scripts/check-armada-token-invariants.py lost its two dead mutations
  (_mutation_open_add_to_whitelist and _mutation_require_wind_down_contract)
  and their ASSERTIONS/MUTATIONS entries (open-add-to-whitelist and
  require-wind-down-contract), plus a stale comment; the two transfer
  mutation anchors were refreshed to the live token's `if (!transferable
  && to != address(0))` guard. scripts/deploy_revenue_lock_cohort.ts
  no longer prints the reverting armToken.addToWhitelist next-step
  (renumbered to addAuthorizedDelegator + treasury.distribute) and now
  notes the allowlist is fixed at deploy via initWhitelist. New harness
