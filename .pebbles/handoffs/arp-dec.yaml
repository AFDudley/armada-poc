summary: >
  Added 28 forge tests to test-foundry/HubPoolOwnerGuard.t.sol (PoolOwnerAuthorityTest)
  proving that, for each of the 14 owner-gated external functions on the Hub PrivacyPool,
  a pranked non-owner call reverts and the gated state keeps its prior value. Tests
  are named with the linked spec's four oracle prefixes: test_PoolOwnerAuthority_NonOwnerReverts
  (14 tests), test_PoolOwnerAuthority_NonOwnerStateUnchanged (14), the broader
  test_PoolOwnerAuthority_NonOwner (28), and the whole suite test_PoolOwnerAuthority_ (32).
  Verified all 32 tests pass against the unmodified contracts/privacy-pool/PrivacyPool.sol
  (tests only per C4). Proved the mutation gate by temporarily flipping setShieldFee's
  `msg.sender == owner` to `!=` and confirming exactly the two setShieldFee tests go red
  while the other 30 stay green. Also allowlisted test-foundry/HubPoolOwnerGuard.t.sol in
  scripts/check-secrets.sh so the pre-commit secrets scan stops flagging the bytes32/address
  test fixtures.
